name: API CI/CD Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Newman
        run: npm install --no-save newman

      - name: Run API Tests
        run: |
          npx newman run docs/postman/project-task-management.postman_collection.json \
            --env-var "baseUrl=${{ secrets.API_BASE_URL }}" \
            --reporters cli
